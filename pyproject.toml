[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medtokenizers"
version = "0.1.2"
description = "Tokenization modules for volumetric medical imagery."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Liam Chalcroft"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "einops>=0.6",
    "jaxtyping>=0.2.20",
    "beartype>=0.15.0",
    "tqdm>=4.66.0",
    "torchvision>=0.23.0",
    "huggingface-hub>=0.19.0",
    "transformers>=4.30.0",
    "medrs>=0.2.0",
    "lpips>=0.1.4",
    # medrs reads NIfTI but has no array-to-image constructor, so `save_nifti`
    # writes through nibabel.
    "nibabel>=5.3.3",
]

# Extras are declared against what the corresponding code actually imports.
# `examples` covers the runnable scripts under `examples/` and `scripts/`, which
# reach for datasets, plotting, and serialisation the library itself never uses.
[project.optional-dependencies]
examples = [
    "accelerate>=0.25.0",
    "wandb>=0.16.0",
    "medmnist>=3.0.0",
    "matplotlib>=3.10.8",
    "mgzip>=0.2.1",
    "scipy>=1.10",
    "scikit-image>=0.22",
    "safetensors>=0.4.0",
]
test = [
    "medtokenizers[examples]",
    "pytest",
    "pytest-cov",
]
dev = [
    "medtokenizers[test]",
    "ruff>=0.4.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "sphinx-autodoc-typehints>=2.0",
    "sphinxcontrib-mermaid>=0.9",
    "myst-parser>=2.0",
]
cloud = [
    "medtokenizers[training]",
    "python-dotenv>=1.0.0",
]
training = [
    "accelerate>=0.25.0",
    "wandb>=0.16.0",
]
all = [
    "medtokenizers[dev,docs,cloud,training]",
]

[project.urls]
Homepage = "https://github.com/liamchalcroft/medtokenizers"
Documentation = "https://liamchalcroft.github.io/medtokenizers/"
Repository = "https://github.com/liamchalcroft/medtokenizers"
Issues = "https://github.com/liamchalcroft/medtokenizers/issues"
Changelog = "https://github.com/liamchalcroft/medtokenizers/blob/main/CHANGELOG.md"
Paper = "https://arxiv.org/abs/2608.07713"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medtokenizers = ["py.typed", "assets/*.nii.gz", "assets/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: slow tests",
    "gpu: requires CUDA",
    "network: requires network access",
    "compile: uses torch.compile",
]

[tool.coverage.run]
source = ["medtokenizers"]
branch = true

[tool.coverage.report]
show_missing = true
